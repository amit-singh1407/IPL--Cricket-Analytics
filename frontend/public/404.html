<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var location = window.location;
        var segments = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
        var projectBase = segments.length > 1 ? '/' + segments[0] : '';
        var route = segments.length > 1 ? segments.slice(1).join('/') : '';
        var target = projectBase + '/#/' + route;
        if (location.search) {
          target += location.search;
        }
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
